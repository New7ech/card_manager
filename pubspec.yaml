version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.0
  firebase_auth: ^6.5.5
  cloud_firestore: ^6.7.0
